// In-app diagnostics: retained for this tab (including same-tab Google redirects).
window.appTraceLog = (() => {
  const KEY = 'll-diagnostic-events-v1', LIMIT = 500;
  let events = [];
  try { events = JSON.parse(sessionStorage.getItem(KEY) || '[]'); if (!Array.isArray(events)) events = []; } catch (_) {}
  const safeText = value => {
    let text;
    try { text = typeof value === 'string' ? value : value instanceof Error ? (value.stack || value.message) : JSON.stringify(value); }
    catch (_) { text = String(value); }
    return String(text || '')
      .replace(/(authorization|access_token|id_token|refresh_token|client_secret|password|apiKey|token|secret)\s*[:=]\s*[^\s,;&]+/gi, '$1=[REDACTED]')
      .replace(/Bearer\s+[A-Za-z0-9._~+\/-]+=*/gi, 'Bearer [REDACTED]')
      .replace(/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*/g, '[JWT REDACTED]')
      .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[EMAIL REDACTED]')
      .slice(0, 5000);
  };
  const safeUrl = raw => {
    try { const u = new URL(raw, location.href); return u.origin + u.pathname; }
    catch (_) { return String(raw || '').split(/[?#]/)[0].slice(0, 300); }
  };
  const save = () => { try { sessionStorage.setItem(KEY, JSON.stringify(events.slice(-LIMIT))); } catch (_) {} };
  const add = (level, source, message, details) => {
    const item = { time: new Date().toISOString(), level, source, message: safeText(message), ...(details ? {details:safeText(details)} : {}) };
    events.push(item); if (events.length > LIMIT) events = events.slice(-LIMIT); save();
    // Mirror every in-app diagnostic event to DevTools so the normal app can be debugged
    // without opening diagnostics.html or the in-app log panel.
    try {
      const consoleMethod = level === 'ERROR' ? 'error' : level === 'WARN' ? 'warn' : 'info';
      console[consoleMethod]('[LittleLearners][' + level + '][' + source + '] ' + item.message,
        details === undefined || details === null || details === '' ? '' : item.details);
    } catch (_) {}
    try { if (typeof updateDiagnosticCount === 'function') updateDiagnosticCount(); if (typeof renderDiagnosticEvents === 'function' && document.getElementById('diagPanel')?.style.display === 'flex') renderDiagnosticEvents(); } catch (_) {}
    return item;
  };
  return { add, all: () => events.slice(), clear: () => { events = []; save(); }, count: () => events.length, safeUrl };
})();

// by appTraceLog before they are retained or printed.
window.addEventListener('error', event => {
  const target = event.target;
  const isResourceError = target && target !== window;
  const detail = {
    message: event.message || (isResourceError ? 'Resource failed to load' : 'Uncaught browser error'),
    filename: event.filename ? window.appTraceLog.safeUrl(event.filename) : '(not exposed)',
    line: event.lineno || null,
    column: event.colno || null,
    targetTag: isResourceError ? (target.tagName || '(unknown element)') : '(window)',
    resourceUrl: isResourceError ? window.appTraceLog.safeUrl(target.src || target.href || '') : '(not applicable)',
    error: event.error ? window.authErrorDetails?.(event.error) || String(event.error) : '(browser did not expose the Error object)'
  };
  window.appTraceLog.add(isResourceError ? 'ERROR' : 'ERROR', isResourceError ? 'resource.error' : 'window.error',
    isResourceError ? 'Script/style/image or other page resource failed to load' : 'Uncaught browser/runtime error', detail);
}, true);

window.authErrorDetails = error => {

};

    kl.refresh();
  } else {
    window.authStep('S5a — Initializing Firebase app', 'Calling initializeApp(config). Config values remain hidden.');
    const appInstance = appSdk.initializeApp(config);
    window.authStep('S5a PASSED — Firebase app initialized', 'App name: ' + appInstance.name);
    window.authRuntimeSnapshot('before-getAuth');
    window.authStep('S5b — Initializing Firebase Auth without eager popup/iframe resolver', 'Using initializeAuth with browser persistence only. The popup resolver will be initialized only from the sign-in click.');
    const auth = authSdk.initializeAuth(appInstance, {
      persistence: [
        authSdk.indexedDBLocalPersistence,
        authSdk.browserLocalPersistence,
        authSdk.inMemoryPersistence
      ]
    });
    window.authStep('S5b PASSED — Firebase Auth initialized without eager popup resolver', 'Auth object created successfully; popup/iframe resolver has not been initialized at startup.');
    window.authRuntimeSnapshot('after-initializeAuth');
    window.authStep('S5c — Initializing Firestore', 'Calling getFirestore(app).');
    const db = dbSdk.getFirestore(appInstance);
    window.authStep('S5c PASSED — Firestore initialized', 'Firestore object created successfully.');
    window.authStep('S5d — Creating Google provider', 'Using the same GoogleAuthProvider configuration as the successful standalone sign-in test.');
    const provider = new authSdk.GoogleAuthProvider();
    window.authStep('S5d PASSED — Google provider configured', 'GoogleAuthProvider is ready; no custom prompt parameter is applied.');
    let cloudWrite = Promise.resolve();
    const profileRef = uid => dbSdk.doc(db, 'users', uid);
    const localSnapshot = () => {
      const state = kl.st();
      return { kids: state.kids, settings: { lang: state.lang, sound: state.sound }, updatedAt: Date.now() };
    };
    const writeProfile = (user, data) => {
      cloudWrite = cloudWrite.then(() => dbSdk.setDoc(profileRef(user.uid), data, { merge: true }));
      return cloudWrite;
    };
    // Redirect-based sign-in avoids opening a separate popup window. The auth-state listener
    // below remains responsible for loading/creating the user's Firestore profile after return.
    window.fb = {
      ok: true,
      signIn: () => {
        kl.st().err = '';
        // No await before signInWithRedirect: invoke it within the original click activation.
        window.authRuntimeSnapshot('before-signInWithRedirect');
        window.authStep('AUTH REDIRECT — Calling Firebase signInWithRedirect', 'Navigating to Google sign-in in this tab; no popup window is opened.');
        try {
          return authSdk.signInWithRedirect(auth, provider, authSdk.browserPopupRedirectResolver);
        } catch (error) {
          window.authStep('AUTH REDIRECT ERROR', window.authErrorDetails(error));
          throw error;
        }
      },
      signOut: () => authSdk.signOut(auth),
      push: async () => {
        const user = auth.currentUser, state = kl.st();
        if (!user || !state.ob) return;
        try {
          await writeProfile(user, { ...localSnapshot(), email: user.email || null, displayName: user.displayName || null });
          window.cloudStatus = 'saved'; state.err = '';
        } catch (error) {
          window.lastErr = error?.code || error?.message || String(error);
          window.cloudStatus = 'save failed';
          state.err = 'Could not save progress online. ' + window.lastErr;
          kl.refresh(); throw error;
        }
      }
    };
    window.authStep('S5 — Redirect-based sign-in ready', 'Google sign-in will navigate in the current tab and restore the session on return.');
    window.authStep('S5 — Registering auth state listener', 'Waiting for Firebase to report whether a user is signed in.');
    authSdk.onAuthStateChanged(auth, async user => {
      const state = kl.st();
      state.user = user ? (user.displayName || user.email || 'Google user') : null;
      window.authStep('S9 — Auth state changed', user ? 'Firebase reports a signed-in user. Checking Firestore profile access next.' : 'Firebase reports no signed-in user.');
      if (!user) { window.cloudStatus = 'signed out'; window.fbStatus = 'Firebase: ready · guarded Google sign-in'; kl.refresh(); return; }
      window.cloudStatus = 'loading profile'; window.fbStatus = 'Firebase: ready'; kl.refresh();
      try {
        window.authStep('S10 — Reading Firestore profile', 'Calling getDoc(users/{current-user-uid}). The UID and profile data are intentionally not displayed.');
        const ref = profileRef(user.uid), snapshot = await dbSdk.getDoc(ref);
        window.authStep('S11 — Firestore profile read completed', snapshot.exists() ? 'Profile document exists.' : 'Profile document does not exist; app will create it.');

        const cloud = snapshot.exists() ? snapshot.data() : {};
        const cloudKids = cloud.kids && typeof cloud.kids === 'object' ? cloud.kids : {};
        if (snapshot.exists()) {
          for (const [id, child] of Object.entries(cloudKids)) {
            const local = state.kids[id];
            if (!local || (Number(child?.stars) || 0) > (Number(local.stars) || 0)) state.kids[id] = child;
          }
          if (cloud.settings && !state.ob) {
            if (['en', 'hi', 'both'].includes(cloud.settings.lang)) state.lang = cloud.settings.lang;
            if (typeof cloud.settings.sound === 'number') state.sound = cloud.settings.sound;
          }
          window.cloudStatus = 'profile loaded';
        } else {
          await dbSdk.setDoc(ref, {
            kids: state.ob ? state.kids : {}, settings: { lang: state.lang, sound: state.sound },
            email: user.email || null, displayName: user.displayName || null,
            createdAt: Date.now(), updatedAt: Date.now()
          });
          window.cloudStatus = 'profile created';
        }
        window.authStep('S12 — Firestore profile processing completed', 'Profile loaded/created. Returning control to the app onboarding flow.');
        kl.save(); kl.authed(Object.keys(cloudKids).length);
      } catch (error) {
        window.authStep('S11 FAILED — Firestore profile access', window.authErrorDetails(error));
        window.lastErr = error?.code || error?.message || String(error);
        window.cloudStatus = 'profile failed';
        state.err = 'Google sign-in succeeded, but cloud profile access failed. ' + window.lastErr;
        kl.refresh();
      }
    });
    // Process the OAuth result after returning from Google. Auth-state listener above hydrates
    // the profile; this call surfaces redirect-specific errors without creating a popup.
    authSdk.getRedirectResult(auth, authSdk.browserPopupRedirectResolver).then(result => {
      if (result?.user) window.authStep('AUTH REDIRECT RESULT — success', 'Google returned a Firebase user; profile handling is delegated to the auth-state listener.');
      else window.authStep('AUTH REDIRECT RESULT — no pending result', 'No redirect credential was pending on this page load.');
    }).catch(error => {
      window.authStep('AUTH REDIRECT RESULT — failed', window.authErrorDetails(error));
      kl.err(error);
    });
    window.fbStatus = 'Firebase: ready'; kl.refresh();
  }
} catch (error) {
  window.authStep('FATAL — Firebase module import/initialization failed', window.authErrorDetails(error));
  window.fbStatus = 'Firebase: failed to load';
  window.lastErr = error?.code || error?.message || String(error);
  console.error('Firebase initialization failed:', error);
  window.kl?.refresh();
}
</script></body></html>
