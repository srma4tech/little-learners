<script>
let llToastTimer;
window.showLLNotice = (message, kind='success') => {
  const toast=document.getElementById('ll-toast');
  if(!toast)return;
  toast.textContent=message;
  toast.dataset.kind=kind;
  toast.classList.add('visible');
  clearTimeout(llToastTimer);
  llToastTimer=setTimeout(()=>toast.classList.remove('visible'),3000);
};
window.authErrorDetails = error => {
  if (!error) return 'Unknown error';
  return [error.code, error.message || String(error)].filter(Boolean).join(': ');
};

// Google sign-in uses Google Identity Services and Firebase credentials.

window.authErrorDetails = error => {
  if (!error) return 'No error object was provided.';
  return [
    'name: ' + (error.name || '(none)'),
    'code: ' + (error.code || '(none)'),
    'message: ' + (error.message || String(error)),
    'customData: ' + (error.customData ? JSON.stringify(error.customData) : '(none)'),
    'stack: ' + (error.stack || '(no stack exposed by browser)')
  ].join('\n');
};
