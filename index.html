    const ensureGis = () => {
      if (window.google?.accounts?.id) return Promise.resolve();
      if (!gisScriptPromise) gisScriptPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://accounts.google.com/gsi/client';
        script.async = true; script.defer = true;
        script.onload = () => window.google?.accounts?.id ? resolve() : reject(new Error('Google Identity Services loaded without the ID API.'));
        script.onerror = () => reject(new Error('Could not load Google Identity Services. Check network or content blockers.'));
        document.head.appendChild(script);
      });
      return gisScriptPromise;
    };
    const handleGisCredential = async response => {
window.msg = '⏳ Signing in securely…'; kl.refresh();
      try {
        if (!response?.credential) throw new Error('Google did not return an ID credential.');
        const credential = authSdk.GoogleAuthProvider.credential(response.credential);
        await authSdk.signInWithCredential(auth, credential);

        window.msg = ''; kl.st().err = '';
      } catch (error) {

        kl.err(error);
      } finally {
        window.msg = ''; kl.refresh();
      }
    };
    window.fb = {
      ok: true,
      gis: true,
      renderGoogle: async container => {
        if (!container) return;
        try {
          await ensureGis();
          if (!gisInitialized) {
            if (!config.googleClientId) throw new Error('googleClientId is missing from firebase-config.js.');
            gisCredentialHandler = response => { void handleGisCredential(response); };
            window.google.accounts.id.initialize({
              client_id: config.googleClientId,
              callback: gisCredentialHandler,
              auto_select: false,
              cancel_on_tap_outside: true
            });
            gisInitialized = true;
          }
          if (!container.isConnected) return;
          container.replaceChildren();
          window.google.accounts.id.renderButton(container, {
            type: 'standard', theme: 'filled_blue', size: 'large',
            text: 'signin_with', shape: 'pill', width: Math.min(280, Math.max(220, Math.floor(container.getBoundingClientRect().width || 280)))
          });

        } catch (error) {

          window.msg = 'Google sign-in could not load. Check your connection and reload the page.';
          kl.refresh();
        }
      },
      signOut: () => authSdk.signOut(auth),
      deleteAccount: async () => {
        const user = auth.currentUser;
        if (!user) throw new Error('Sign in to the account you want to delete.');
        const children = await dbSdk.getDocs(kidCollectionRef(user.uid));
        for (const child of children.docs) await dbSdk.deleteDoc(child.ref);
        await dbSdk.deleteDoc(profileRef(user.uid));
        try {
          await authSdk.deleteUser(user);
        } catch (error) {
          if (error?.code === 'auth/requires-recent-login') {
            throw new Error('Your cloud learning data was deleted, but Google requires a fresh sign-in before it can delete this account. Sign out, sign in again, then retry Delete my data and account.');
          }
          throw error;
        }
        for (const key of ['kl','kl_guest','kl_guest_backup_v1','kl_account_uid','kl_last_account_uid','kl_account_cache_'+user.uid,'kl_last_sync_'+user.uid]) {
          try { localStorage.removeItem(key); } catch (_) {}
        }
        state.kids={me:{name:'Me',stars:0}};state.kid='me';state.lang='both';state.sound=1;state.ob=0;state.step=0;state.user=null;
        window.cloudStatus='account deleted';profileReady=false;
        await authSdk.signOut(auth);
        location.reload();
      },
      renameKid: async (childId, name) => {
        const user = auth.currentUser, state = kl.st();
        if (!user || !profileReady) throw new Error('Cloud profile is not ready.');
        if (!state.kids[childId]) throw new Error('Child profile was not found.');
        // Rename is an explicit profile edit: persist it after the normal progress merge,
        // otherwise mergeKid may restore the old non-default remote name.
        const safeName = String(name || '').replace(/[<>&"']/g, '').trim().slice(0, 12);
        if (!safeName || !state.kids[childId]) throw new Error('Child profile could not be renamed.');
        cloudWrite = cloudWrite.catch(() => {}).then(() => dbSdk.runTransaction(db, async transaction => {
          const ref = kidRef(user.uid, childId), snapshot = await transaction.get(ref);
          const remoteKid = snapshot.exists() ? snapshot.data() : null;
          const merged = window.LLProgress.mergeKid(state.kids[childId], remoteKid, deviceId);
          if (!merged) throw new Error('Child profile could not be renamed.');
          merged.name = safeName; merged.updatedAt = Date.now();
          transaction.set(ref, merged);
          return merged;
        }));
        const savedKid = await cloudWrite;
        if (savedKid) state.kids[childId] = savedKid;
        try { localStorage.setItem('kl', JSON.stringify({ ...state, user: undefined, err: undefined })); } catch (_) {}
        window.cloudStatus = 'saved'; state.err = ''; markSynced(); window.showLLNotice?.('Child name saved and synced to cloud.');
      },
      statusMarkup: () => {
        const last = Number(localStorage.getItem('kl_last_sync_' + (auth.currentUser?.uid || '')) || 0);
        const pending = isDirty();
        const when = last ? new Date(last).toLocaleString() : 'Not synced yet';
        return `<div class="sync-status" role="status"><strong>☁️ Cloud sync</strong>${pending ? 'Changes are waiting to sync.' : 'All local changes are synced.'}<br>Last successful sync: ${when}<br>Automatic check: every 3 hours while the app is open.</div>`;
      },
      schedulePush: () => {
        if (!auth.currentUser || !profileReady || !isDirty()) return;
        if (syncTimer) clearTimeout(syncTimer);
        syncPending = true;
        syncTimer = setTimeout(() => { void window.fb.push().catch(() => {}); }, 1200);
      },
      push: async () => {
        const user = auth.currentUser, state = kl.st();
        if (!user || !state.ob || !profileReady) return;
        if (!isDirty()) { syncPending = false; return; }
        if (syncInFlight) return syncInFlight;
        syncInFlight = (async () => {
        try {
          const savedProfile = await writeProfile(user, localSnapshot());
          if (savedProfile && savedProfile.kids) {
            state.kids = window.LLProgress.mergeKids(state.kids, savedProfile.kids, deviceId);
            try { localStorage.setItem('kl', JSON.stringify({ ...state, user: undefined, err: undefined })); } catch (_) {}
          }
          window.cloudStatus = 'saved'; state.err = ''; markSynced();
          window.showLLNotice?.('Saved and synced to cloud.');
        } catch (error) {
          window.lastErr = error?.code || error?.message || String(error);
          window.cloudStatus = 'save failed'; syncPending = true;
          state.err = '';
          window.cloudStatus = !navigator.onLine ? 'offline - will sync' : 'sync pending';
          window.showLLNotice?.(!navigator.onLine ? 'Offline — saved on this device; will sync when online.' : 'Saved on this device; cloud sync is pending.', 'info');
          kl.refresh(); throw error;
        } finally { syncInFlight = null; }
        })();
        return syncInFlight;
      }
    };


    authSdk.onAuthStateChanged(auth, async user => {
      const state = kl.st();
      let previousUid = '', lastUid = '';
      try { previousUid = localStorage.getItem('kl_account_uid') || ''; lastUid = localStorage.getItem('kl_last_account_uid') || ''; } catch (_) {}
      if (!user) {
        profileReady = false;
        state.user = null;
        window.cloudStatus = 'signed out';
        window.fbStatus = 'Firebase: ready · guest mode';
        // Firebase also emits an initial null user for ordinary guest sessions.
        // Preserve their live local state unless we are actually leaving an account.
        if (!previousUid) { kl.refresh(); return; }
        // Preserve account-local work (including any unsynced offline changes) separately.
        try { localStorage.setItem('kl_account_cache_' + previousUid, localStorage.getItem('kl') || '{}'); localStorage.setItem('kl_last_account_uid', previousUid); } catch (_) {}
        // Never expose an account's cached profile as guest progress.
        let guest = null;
        try { guest = JSON.parse(localStorage.getItem('kl_guest') || localStorage.getItem('kl_guest_backup_v1') || 'null'); } catch (_) {}
        try { localStorage.removeItem('kl_account_uid'); } catch (_) {}
        state.kids = guest?.kids && typeof guest.kids === 'object' ? guest.kids : { me: { name: 'Me', stars: 0 } };
        state.kid = state.kids[state.kid] ? state.kid : Object.keys(state.kids)[0] || 'me';
        if (!state.kids[state.kid]) state.kids.me = { name: 'Me', stars: 0 };
        state.lang = ['en', 'hi', 'both'].includes(guest?.settings?.lang) ? guest.settings.lang : 'both';
        state.sound = typeof guest?.settings?.sound === 'number' ? (guest.settings.sound ? 1 : 0) : 1;
        state.ob = Object.values(state.kids).some(k => k?.name && k.name !== 'Me') ? 1 : 0;
        state.step = state.ob ? 3 : 0;
        state.err = '';
        window.msg = '';
        kl.save(); home();
        return;
      }

      // Stop writes while the active identity is being resolved. This prevents
      // a previous account's save queue from writing into the newly selected account.
      profileReady = false;
      // Snapshot guest progress before switching the active profile. Account A's
      // cached data is never treated as guest data or merged into account B.
      let choice = 'account';
      try {
        if (!previousUid) {
          if (lastUid && lastUid === user.uid) {
            // Returning to the same account: restore only that account's local cache.
            let cached = null;
            try { cached = JSON.parse(localStorage.getItem('kl_account_cache_' + user.uid) || 'null'); } catch (_) {}
            if (cached && typeof cached === 'object') {
              state.kids = cached.kids && typeof cached.kids === 'object' ? cached.kids : { me: { name: 'Me', stars: 0 } };
              state.kid = cached.kid || 'me'; state.lang = cached.lang || 'both'; state.sound = typeof cached.sound === 'number' ? cached.sound : 1;
              state.ob = cached.ob ? 1 : 0; state.step = Number(cached.step) || 0;
              choice = 'merge';
            } else {
              choice = 'account';
            }
          } else {
            const current = JSON.parse(localStorage.getItem('kl') || '{}');
            const guestSnapshot = {
              kids: current.kids && typeof current.kids === 'object' ? current.kids : { me: { name: 'Me', stars: 0 } },
              kid: current.kid || 'me',
              settings: { lang: current.lang || 'both', sound: typeof current.sound === 'number' ? current.sound : 1 },
              schemaVersion: 2,
              savedAt: Date.now()
            };
            localStorage.setItem('kl_guest', JSON.stringify(guestSnapshot));
            localStorage.setItem('kl_guest_backup_v1', JSON.stringify(guestSnapshot));
            const meaningful = Object.values(guestSnapshot.kids).some(k => k && ((k.name && k.name !== 'Me') || Number(k.stars) > 0));
            if (meaningful && !lastUid) {
              choice = window.confirm(
                'Add this device’s kids to your account?\n\nOK: Add\nCancel: Keep account only (guest data stays on this device).') ? 'merge' : 'account';
            } else {
              choice = 'account';
            }
          }
        } else if (previousUid !== user.uid) {
          // Preserve the previous account's device cache under its own UID.
          localStorage.setItem('kl_account_cache_' + previousUid, localStorage.getItem('kl') || '{}');
          state.kids = { me: { name: 'Me', stars: 0 } };
          state.kid = 'me'; state.lang = 'both'; state.sound = 1; state.ob = 0; state.step = 0;
          kl.save(); // Replace the prior account's active local snapshot before any network wait.
          choice = 'account';
        } else {
          choice = 'merge'; // Same account: reconcile same-account offline work.
        }
      } catch (_) {
        // If local storage is unavailable, fail closed: load the account only.
        choice = previousUid === user.uid ? 'merge' : 'account';
      }

      state.user = user.displayName || user.email || 'Google user';
      try { localStorage.setItem('kl_account_uid', user.uid); localStorage.setItem('kl_last_account_uid', user.uid); } catch (_) {}
      profileReady = false;
      window.cloudStatus = 'loading profile'; window.fbStatus = 'Firebase: ready'; kl.refresh();
      try {
        const ref = profileRef(user.uid), snapshot = await dbSdk.getDoc(ref);
        const cloud = snapshot.exists() ? snapshot.data() : {};
        const validKids = source => Object.fromEntries(Object.entries(source).filter(([id, kid]) =>
          /^[A-Za-z0-9_-]{1,64}$/.test(id) && kid && typeof kid === 'object' && typeof kid.name === 'string' && kid.name.trim().length > 0 && kid.name.trim().length <= 12 &&
          Number.isFinite(kid.stars) && Number.isInteger(kid.stars) && kid.stars >= 0 && kid.stars <= 100000
        ).slice(0,10));
        const childDocs = await dbSdk.getDocs(kidCollectionRef(user.uid));
        let cloudKids = Object.fromEntries(childDocs.docs.map(child => [child.id, child.data()]));
        if (childDocs.empty && cloud.kids && typeof cloud.kids === 'object') {
          // Publish the allowed child IDs first, then migrate each child, then remove legacy fields.
          cloudKids = validKids(cloud.kids);
          await dbSdk.updateDoc(ref, {email:dbSdk.deleteField(), displayName:dbSdk.deleteField(), kidIds:Object.keys(cloudKids).slice(0,10), schemaVersion:3, updatedAt:Date.now()});
          for (const [childId, childData] of Object.entries(cloudKids)) {
            await dbSdk.runTransaction(db, async transaction => {
              const childRef = kidRef(user.uid, childId), childSnap = await transaction.get(childRef);
              if (!childSnap.exists()) transaction.set(childRef, childData);
            });
          }
          await dbSdk.updateDoc(ref, {kids:dbSdk.deleteField(), updatedAt:Date.now()});
          window.cloudStatus = 'migrated legacy profile';
        }
        if (snapshot.exists() && !Array.isArray(cloud.kidIds) && !(cloud.kids && typeof cloud.kids === 'object')) {
          await dbSdk.updateDoc(ref, {kids:dbSdk.deleteField(), email:dbSdk.deleteField(), displayName:dbSdk.deleteField(), kidIds:Object.keys(cloudKids).slice(0,10), schemaVersion:3, updatedAt:Date.now()});
        }
        const localKids = choice === 'merge' && state.kids && typeof state.kids === 'object' ? state.kids : {};
        const mergedKids = window.LLProgress.mergeKids(validKids(localKids), validKids(cloudKids), deviceId);
        for (const kid of Object.values(mergedKids)) {
          kid.name = String(kid.name || 'Me').replace(/[<>&"']/g, '').trim().slice(0, 12) || 'Me';
        }
        state.kids = Object.keys(mergedKids).length ? mergedKids : { me: { name: 'Me', stars: 0, starCounters: {}, resetGeneration: 0 } };
        if (!state.kids[state.kid]) state.kid = Object.keys(state.kids)[0];
        if (cloud.settings && typeof cloud.settings === 'object') {
          const localSettingsTimestamp=Number(state.settingsUpdatedAt)||0;
          const remoteSettingsTimestamp=Number(cloud.settingsUpdatedAt)||0;
          if (choice !== 'merge' || remoteSettingsTimestamp > localSettingsTimestamp) {
            state.lang = ['en', 'hi', 'both'].includes(cloud.settings.lang) ? cloud.settings.lang : 'both';
            state.sound = cloud.settings.sound === 0 || cloud.settings.sound === 1 ? cloud.settings.sound : 1;
            state.settingsUpdatedAt=remoteSettingsTimestamp;
          }
          window.savedSettingsSignature=JSON.stringify({lang:state.lang,sound:state.sound});
        } else if (choice !== 'merge') {
          state.lang = 'both'; state.sound = 1; state.settingsUpdatedAt=0;
          window.savedSettingsSignature=JSON.stringify({lang:state.lang,sound:state.sound});
        }
        const hasConfiguredChild = Object.values(state.kids).some(kid => kid.name && kid.name !== 'Me' && !kid.deletedAt);
        state.ob = hasConfiguredChild ? 1 : 0;
        state.step = state.ob ? 3 : 2;
        window.cloudStatus = !state.ob ? 'needs child setup' : (snapshot.exists() ? 'profile loaded' : 'profile created');
        profileReady = true;
        kl.save();
        // Do not create an empty cloud document before a first-time parent has
        // completed child setup. finish() will schedule the first write.
        if (!snapshot.exists() && !state.ob) {
          window.cloudStatus = 'needs child setup';
          kl.refresh();
          return;
        }
        // "Keep account only" never uploads the guest snapshot.
        await writeProfile(user, {
          ...localSnapshot(),
          createdAt: typeof cloud.createdAt === 'number' ? cloud.createdAt : Date.now()
        });
        markSynced();
        kl.save(); kl.authed(true);
      } catch (error) {
        // Fail closed: never leave guest progress visible under a signed-in
        // account when the account's cloud profile could not be loaded.
        profileReady = false;
        state.kids = { me: { name: 'Me', stars: 0, starCounters: {}, resetGeneration: 0 } };
        state.kid = 'me';
        state.lang = 'both';
        state.sound = 1;
        state.ob = 0;
        state.step = 0;
        window.lastErr = error?.code || error?.message || String(error);
        window.cloudStatus = 'profile failed';
        state.err = 'Google sign-in succeeded, but cloud profile access failed. Account progress is not loaded; sign out to return to guest mode, or reload to retry. ' + window.lastErr;
        kl.save();
        kl.refresh();
      }
    });
    window.fbStatus = 'Firebase: ready'; kl.refresh();
  }
} catch (error) {

  window.fbStatus = 'Firebase: failed to load';
  window.lastErr = error?.code || error?.message || String(error);
  console.error('Firebase initialization failed:', error);
  window.kl?.refresh();
}
</script></body></html>
