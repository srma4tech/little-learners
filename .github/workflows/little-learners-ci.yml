name: Little Learners CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  source-check:
    name: Source syntax and configuration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.current=None
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      attrs=dict(attrs)
                      self.current={"type":attrs.get("type",""),"src":attrs.get("src"),"text":""}
              def handle_data(self, data):
                  if self.current is not None: self.current["text"] += data
              def handle_endtag(self, tag):
                  if tag == "script" and self.current is not None:
                      self.scripts.append(self.current); self.current=None
          parser=Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          inline=[s for s in parser.scripts if not s["src"] and s["text"].strip()]
          if not inline: raise SystemExit("No inline scripts found")
          for i,s in enumerate(inline):
              Path(f"/tmp/inline-{i}.mjs" if s["type"]=="module" else f"/tmp/inline-{i}.js").write_text(s["text"],encoding="utf-8")
              print(f"Prepared inline script {i} ({s['type'] or 'classic'})")
          PY
          for f in /tmp/inline-*.js /tmp/inline-*.mjs; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
      - name: Check live browser smoke script syntax
        run: node --check .github/scripts/live-smoke.mjs
      - name: Test reset-aware progress merge rules
        run: node --test tests/progress-model.test.cjs
      - name: Scan tracked files for private credentials
        run: python3 .github/scripts/secret-scan.py
      - name: Check required app files and cache version
        run: |
          test -s index.html
          test -s firebase-config.js
          test -s progress-model.js
          test -s firestore.rules
          test -s manifest.webmanifest
          grep -q "little-learners-v" sw.js
          grep -q "onAuthStateChanged" index.html
          grep -q "signInWithCredential" index.html
          grep -q "GoogleAuthProvider.credential" index.html
          grep -q "accounts.id.initialize" index.html
          echo "Required files and Google Identity Services auth markers found."

  live-smoke:
    name: Live site browser smoke test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check deployed site and capture browser errors
        run: node .github/scripts/live-smoke.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-learners-browser-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e:
    name: Playwright user-flow tests (Firebase stub)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run onboarding, quiz, XSS, and offline tests
        run: npx playwright test tests/e2e.spec.cjs --workers=1
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-learners-pwa-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit manifest screenshots to the same-repository PR branch
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p /tmp/little-learners-screenshots
          cp artifacts/screenshots/*.png /tmp/little-learners-screenshots/
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" FETCH_HEAD
          mkdir -p screenshots
          cp /tmp/little-learners-screenshots/*.png screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/little-learners-desktop.png screenshots/little-learners-mobile.png
          if git diff --cached --quiet; then
            echo "Screenshot assets are already current."
            exit 0
          fi
          git commit -m "chore(E6): add install screenshots"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${HEAD_REF}"
